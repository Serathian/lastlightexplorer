name: Build and Push Docker Image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger Watchtower Webhook
        run: |
          if [ -n "${{ secrets.WATCHTOWER_TOKEN }}" ]; then
            echo "Triggering Watchtower update..."
            curl -f -X POST \
              -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
              https://watchtower.jake-reddy.com/v1/update || echo "Watchtower webhook call failed (droplet may be offline or initializing)"
          else
            echo "WATCHTOWER_TOKEN secret is not set; skipping webhook trigger."
          fi
